[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "x-lens-simulation"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "camel-oasis==0.2.5",
    "camel-ai==0.2.78",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]
