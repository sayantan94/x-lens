[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "x-lens-simulation"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "camel-oasis==0.2.5",
    "camel-ai==0.2.78",
    "litellm==1.80.0",
    "openai==1.109.1",
    "pydantic==2.12.5",
    "python-dotenv==1.2.2",
]

# Install with: pip install -r requirements.txt
# requirements.txt is the source of truth (regenerate with
# `pip freeze --exclude-editable > requirements.txt`). pyproject mirrors
# the core deps with `==` so `pip install -e .` also produces a pinned graph.

[project.optional-dependencies]
dev = ["pytest==8.2.0", "pytest-asyncio==0.23.6"]
