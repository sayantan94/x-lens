<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>x-lens simulation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--font:'Inter',system-ui,sans-serif;--mono:'JetBrains Mono',monospace;--bg:#fafafa;--surface:#fff;--border:#e8e8e8;--border-light:#f0f0f0;--text:#111;--text-2:#555;--text-3:#999;--green:#16a34a;--red:#dc2626;--blue:#2563eb;--amber:#d97706}
body{background:var(--bg);color:var(--text);font-family:var(--font);height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:#ddd;border-radius:3px}

/* ── Top Bar ── */
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.topbar-left{display:flex;align-items:center;gap:20px}
.logo{font-size:15px;font-weight:700;letter-spacing:-.03em}
.logo span{color:var(--text-3);font-weight:400;font-size:12px;font-family:var(--mono);margin-left:6px}
.chips{display:flex;gap:6px}
.chip{font-size:11px;font-family:var(--mono);padding:4px 10px;border-radius:6px;background:var(--bg);border:1px solid var(--border);color:var(--text-2);display:flex;align-items:center;gap:5px}
.chip .dot{width:6px;height:6px;border-radius:50%}
.chip .dot.tw{background:#000}
.chip .dot.rd{background:var(--amber)}
.chip b{color:var(--text);font-weight:600}

.topbar-right{display:flex;align-items:center;gap:12px}
.status{display:flex;align-items:center;gap:6px;font-size:11px;font-family:var(--mono);color:var(--text-3)}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--amber);animation:blink 1.2s infinite}
.status-dot.done{background:var(--green);animation:none}
@keyframes blink{50%{opacity:.3}}

/* ── Pipeline Bar ── */
.pipeline{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 24px;display:flex;align-items:center;gap:0;flex-shrink:0}
.pipe-step{display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:6px;font-size:11px;font-family:var(--mono);color:var(--text-3);transition:all .2s;white-space:nowrap}
.pipe-step.active{background:var(--text);color:#fff;font-weight:600}
.pipe-step.done-step{color:var(--green);font-weight:500}
.pipe-step .pipe-icon{font-size:13px}
.pipe-arrow{color:var(--border);font-size:14px;margin:0 2px;flex-shrink:0}
.pipe-detail{font-size:10px;color:var(--text-3);font-family:var(--mono);margin-left:auto;display:flex;gap:16px;align-items:center}
.pipe-detail .pd-item{display:flex;align-items:center;gap:4px}
.pipe-detail .pd-val{font-weight:600;color:var(--text-2)}

/* ── Layout ── */
.layout{display:flex;flex:1;overflow:hidden}

/* ── Resizer ── */
.resizer{width:5px;cursor:col-resize;background:var(--border);flex-shrink:0;transition:background .15s}
.resizer:hover,.resizer.dragging{background:var(--blue);opacity:.6}

/* ── Feed ── */
.feed-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;border-right:none;min-width:200px}
.feed-bar{padding:10px 24px;border-bottom:1px solid var(--border-light);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;background:var(--surface)}
.feed-bar-left{display:flex;align-items:center;gap:12px}
.feed-count{font-size:12px;font-weight:600;color:var(--text-2)}
.feed-filters{display:flex;gap:4px}
.filter-btn{font-size:10px;font-family:var(--mono);padding:3px 8px;border-radius:4px;border:1px solid transparent;background:transparent;color:var(--text-3);cursor:pointer;font-weight:500}
.filter-btn:hover{color:var(--text-2)}
.filter-btn.active{background:var(--text);color:#fff;border-color:var(--text)}

.feed-scroll{flex:1;overflow-y:auto;padding:8px 0}

/* Post cards */
.post{padding:14px 24px;border-bottom:1px solid var(--border-light);transition:background .1s}
.post:hover{background:rgba(0,0,0,.015)}
.post-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--text);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;text-transform:uppercase}
.avatar.bear{background:var(--red)}
.avatar.bull{background:var(--green)}
.avatar.neutral{background:#666}
.post-meta{flex:1;min-width:0}
.post-name{font-size:13px;font-weight:600}
.post-sub{font-size:11px;color:var(--text-3);font-family:var(--mono);display:flex;gap:6px;align-items:center}
.post-body{font-size:14px;line-height:1.65;color:var(--text);margin-left:42px}
.post-badge{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:3px;white-space:nowrap}
.badge-post{background:#e8f5e9;color:#2e7d32}
.badge-like{background:#fff3e0;color:#e65100}
.badge-repost{background:#e3f2fd;color:#1565c0}
.badge-comment{background:#f3e5f5;color:#7b1fa2}
.badge-follow{background:var(--bg);color:var(--text-3);border:1px solid var(--border)}
.badge-quote{background:#e0f2f1;color:#00695c}
.badge-idle{background:var(--bg);color:var(--text-3);opacity:.5}
.badge-other{background:var(--bg);color:var(--text-3)}
.badge-search{background:#ede9fe;color:#6d28d9}

/* Search card */
.search-card{margin-left:42px;margin-top:8px;padding:12px 14px;background:linear-gradient(135deg,#faf5ff,#f3e8ff);border-radius:10px;border:1px solid #e9d5ff;font-size:12px;line-height:1.6}
.search-query{font-family:var(--mono);font-size:11px;color:#7c3aed;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.search-query::before{content:'🔍';font-size:13px}
.search-result{color:var(--text-2);max-height:none;white-space:pre-wrap;word-break:break-word;margin-top:6px;padding:8px 10px;background:rgba(255,255,255,0.6);border-radius:6px;font-size:11.5px;line-height:1.55}
.search-result.collapsed{max-height:80px;overflow:hidden;position:relative}
.search-result.collapsed::after{content:'';position:absolute;bottom:0;left:0;right:0;height:30px;background:linear-gradient(transparent,#f3e8ff)}
.search-toggle{font-size:10px;color:#7c3aed;cursor:pointer;margin-top:4px;font-family:var(--mono);user-select:none}
.search-toggle:hover{text-decoration:underline}
.search-sources{margin-top:6px;font-size:10px;color:var(--text-3);font-family:var(--mono)}
.search-remaining{font-size:10px;color:#a78bfa;font-family:var(--mono);margin-top:4px}

/* Search stats in pipeline bar */
.search-stat{color:#7c3aed;font-weight:600}

/* Fact-check verdict badges */
.verdict-badge{font-size:9px;font-weight:700;padding:2px 6px;border-radius:3px;margin-left:6px;cursor:help;display:inline-block}
.verdict-verified{background:#dcfce7;color:#166534}
.verdict-mismatch{background:#fee2e2;color:#991b1b}
.verdict-partial{background:#fef9c3;color:#854d0e}
.verdict-unverifiable{background:#f3f4f6;color:#6b7280}

/* Fact-check detail block under posts */
.fc-detail{margin-left:42px;margin-top:8px;padding:10px 12px;border-radius:8px;font-size:11px;line-height:1.5}
.fc-detail.verified{background:#f0fdf4;border:1px solid #bbf7d0}
.fc-detail.mismatch{background:#fef2f2;border:1px solid #fecaca}
.fc-detail.partial{background:#fefce8;border:1px solid #fef08a}
.fc-claim{display:flex;gap:8px;padding:4px 0;border-bottom:1px solid rgba(0,0,0,0.05)}
.fc-claim:last-child{border-bottom:none}
.fc-sources{margin-top:6px;font-size:10px;color:var(--text-3);font-family:var(--mono)}

.post-quoted{margin-left:42px;margin-top:8px;padding:10px 12px;background:var(--bg);border-radius:6px;border:1px solid var(--border-light);font-size:12px;color:var(--text-2);line-height:1.5}
.post-action-info{margin-left:42px;font-size:12px;color:var(--text-3);margin-bottom:4px;display:flex;align-items:center;gap:4px}

.feed-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:8px;color:var(--text-3)}
.feed-empty-text{font-size:12px;font-family:var(--mono)}
.spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--text-3);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Sidebar ── */
.sidebar{width:360px;display:flex;flex-direction:column;overflow:hidden;background:var(--surface);flex-shrink:0;min-width:200px}
.sidebar-tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0}
.sidebar-tab{flex:1;text-align:center;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:14px 0;color:var(--text-3);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;transition:all .15s}
.sidebar-tab:hover{color:var(--text-2)}
.sidebar-tab.active{color:var(--text);border-bottom-color:var(--text)}
.sidebar-body{flex:1;overflow-y:auto;padding:0 16px}
.tab-panel{display:none}
.tab-panel.active{display:block}

/* Agent cards */
.agent{padding:14px 0;border-bottom:1px solid var(--border-light)}
.agent-top{display:flex;align-items:center;gap:10px;margin-bottom:6px;cursor:pointer}
.agent-top:hover .agent-name{color:var(--blue)}
.agent-av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;flex-shrink:0;text-transform:uppercase}
.agent-av.bull{background:var(--green)}
.agent-av.bear{background:var(--red)}
.agent-av.neutral{background:#888}
.agent-info{flex:1;min-width:0}
.agent-name{font-size:13px;font-weight:600;transition:color .1s}
.agent-handle{font-size:10px;font-family:var(--mono);color:var(--text-3)}
.agent-tags{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.tag{font-size:9px;font-weight:600;padding:2px 6px;border-radius:3px;background:var(--bg);color:var(--text-2);border:1px solid var(--border)}
.tag.topic{background:#eef2ff;color:#4338ca;border-color:#c7d2fe}
.agent-summary{display:flex;gap:12px;margin-top:8px;align-items:center}
.agent-stat-label{font-size:9px;font-weight:600;text-transform:uppercase;color:var(--text-3);letter-spacing:.03em}
.agent-stat-val{font-size:12px;font-family:var(--mono);font-weight:500}
.bias-bar{width:50px;height:4px;background:var(--border);border-radius:2px;position:relative;display:inline-block;vertical-align:middle}
.bias-fill{position:absolute;top:0;height:100%;border-radius:2px}
.bias-fill.bull{background:var(--green);left:50%}
.bias-fill.bear{background:var(--red);right:50%}

/* Agent expanded detail */
.agent-detail{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border)}
.agent.expanded .agent-detail{display:block}
.agent-section-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);margin:10px 0 4px}
.agent-section-label:first-child{margin-top:0}
.agent-persona{font-size:11px;line-height:1.65;color:var(--text-2);white-space:pre-wrap}
.agent-bio-full{font-size:11px;color:var(--text-2);line-height:1.5;font-style:italic}
.agent-action-log{margin-top:6px}
.agent-action{padding:6px 0;border-bottom:1px solid var(--border-light);font-size:11px;display:flex;gap:8px;align-items:flex-start}
.agent-action:last-child{border-bottom:none}
.agent-action-round{font-family:var(--mono);color:var(--text-3);font-size:10px;flex-shrink:0;width:28px}
.agent-action-content{flex:1;color:var(--text-2);line-height:1.5}
.expand-hint{font-size:10px;color:var(--text-3);margin-top:4px;font-family:var(--mono)}

/* Config panel */
.config-section{padding:14px 0;border-bottom:1px solid var(--border-light)}
.config-label{font-size:10px;font-weight:600;text-transform:uppercase;color:var(--text-3);letter-spacing:.04em;margin-bottom:6px}
.config-val{font-size:13px;line-height:1.6;color:var(--text)}
.config-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.config-kv{display:flex;flex-direction:column}
.config-k{font-size:9px;font-weight:600;text-transform:uppercase;color:var(--text-3)}
.config-v{font-size:12px;font-family:var(--mono);font-weight:500}

/* Report panel */
.report{padding:16px 0;font-size:13px;line-height:1.75;color:var(--text)}
.report h1,.report h2{font-size:15px;font-weight:700;margin:20px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--border-light)}
.report h3{font-size:13px;font-weight:700;margin:14px 0 6px}
.report strong{font-weight:600}
.report hr{border:none;border-top:1px solid var(--border-light);margin:16px 0}
.empty-state{padding:48px 0;text-align:center;color:var(--text-3);font-size:11px;font-family:var(--mono)}

@media(max-width:900px){
  .sidebar{display:none}
  .feed-panel{border-right:none}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="logo">x-lens<span id="sim-id"></span></div>
    <select id="sim-picker" style="font-size:11px;font-family:var(--mono);padding:4px 8px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);cursor:pointer;max-width:260px">
      <option value="">Current simulation</option>
    </select>
    <div class="chips">
      <div class="chip"><span class="dot tw"></span>Twitter <b id="tw-stat">0</b></div>
      <div class="chip"><span class="dot rd"></span>Reddit <b id="rd-stat">0</b></div>
      <div class="chip">Round <b id="round-stat">0/0</b></div>
      <div class="chip">Agents <b id="agent-stat">0</b></div>
    </div>
  </div>
  <div class="topbar-right">
    <div class="status">
      <div class="status-dot" id="status-dot"></div>
      <span id="status-label">waiting</span>
    </div>
  </div>
</div>

<div class="pipeline" id="pipeline">
  <div class="pipe-step" data-stage="waiting" id="ps-profiles"><span class="pipe-icon">&#9679;</span> Profiles</div>
  <span class="pipe-arrow">&#8594;</span>
  <div class="pipe-step" data-stage="configuring" id="ps-config"><span class="pipe-icon">&#9679;</span> Config</div>
  <span class="pipe-arrow">&#8594;</span>
  <div class="pipe-step" data-stage="simulating" id="ps-sim"><span class="pipe-icon">&#9679;</span> Simulating <span id="ps-sim-round"></span></div>
  <span class="pipe-arrow">&#8594;</span>
  <div class="pipe-step" data-stage="generating_report" id="ps-report"><span class="pipe-icon">&#9679;</span> Report</div>
  <span class="pipe-arrow">&#8594;</span>
  <div class="pipe-step" data-stage="done" id="ps-done"><span class="pipe-icon">&#9679;</span> Done</div>
  <div class="pipe-detail" id="pipe-detail"></div>
</div>

<div class="layout">
  <div class="feed-panel">
    <div class="feed-bar">
      <div class="feed-bar-left">
        <div class="feed-count" id="feed-count">0 events</div>
        <div class="feed-filters" id="filters">
          <button class="filter-btn active" data-f="all">All</button>
          <button class="filter-btn" data-f="posts">Posts</button>
          <button class="filter-btn" data-f="searches">🔍 Searches</button>
          <button class="filter-btn" data-f="fact-checks">✓✗ Fact Checks</button>
          <button class="filter-btn" data-f="twitter">Twitter</button>
          <button class="filter-btn" data-f="reddit">Reddit</button>
        </div>
      </div>
    </div>
    <div class="feed-scroll" id="feed">
      <div class="feed-empty" id="feed-empty">
        <div class="spinner"></div>
        <div class="feed-empty-text">Waiting for simulation data</div>
      </div>
    </div>
  </div>

  <div class="resizer" id="resizer"></div>

  <div class="sidebar">
    <div class="sidebar-tabs">
      <button class="sidebar-tab active" data-tab="agents">Agents</button>
      <button class="sidebar-tab" data-tab="seeds">Seeds</button>
      <button class="sidebar-tab" data-tab="config">Config</button>
      <button class="sidebar-tab" data-tab="fact-checks">Fact Checks</button>
      <button class="sidebar-tab" data-tab="report">Report</button>
    </div>
    <div class="sidebar-body">
      <div class="tab-panel active" id="tab-agents"><div class="empty-state">Loading...</div></div>
      <div class="tab-panel" id="tab-seeds"><div class="empty-state">No seed posts</div></div>
      <div class="tab-panel" id="tab-config"><div class="empty-state">Loading...</div></div>
      <div class="tab-panel" id="tab-fact-checks"><div class="empty-state">No fact-checks yet</div></div>
      <div class="tab-panel" id="tab-report"><div class="empty-state">Not generated yet</div></div>
    </div>
  </div>
</div>

<script>
(function(){
const API=window.location.origin;
let actions=[],profiles=[],config={},filter='all',lastCount=0;
let activeSim=''; // empty = current sim

// ── Simulation Picker ──
async function loadSimList(){
  try{
    const r=await fetch(API+'/api/simulations');
    const sims=await r.json();
    const picker=document.getElementById('sim-picker');
    picker.innerHTML='<option value="">Current simulation</option>';
    sims.forEach(s=>{
      const opt=document.createElement('option');
      opt.value=s.id;
      const meta=s.metadata||{};
      const scenario=(meta.scenario||'').substring(0,80);
      const status=s.running?' ⚡ LIVE':s.has_report?' ✓':'';
      const label=s.id+(scenario?' — '+scenario:'')+status;
      opt.textContent=label;
      if(s.id===activeSim) opt.selected=true;
      picker.appendChild(opt);
    });
  }catch(e){}
}
document.getElementById('sim-picker').addEventListener('change',function(){
  activeSim=this.value;
  actions=[];profiles=[];config={};lastCount=0;
  // Clear all rendered panels
  document.getElementById('feed').innerHTML='';
  document.getElementById('tab-agents').innerHTML='<div class="empty-state">Loading...</div>';
  document.getElementById('tab-seeds').innerHTML='<div class="empty-state">Loading...</div>';
  document.getElementById('tab-config').innerHTML='<div class="empty-state">Loading...</div>';
  document.getElementById('tab-report').innerHTML='<div class="empty-state">Loading...</div>';
  document.getElementById('sim-id').textContent=activeSim||'';
  document.getElementById('tw-stat').textContent='0';
  document.getElementById('rd-stat').textContent='0';
  document.getElementById('round-stat').textContent='0/0';
  document.getElementById('agent-stat').textContent='0';
  fetchAll();
});
loadSimList();
setInterval(loadSimList,15000); // refresh sim list every 15s

const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

// Sentiment color from profiles
const biasMap={};
function getBiasClass(name){
  if(biasMap[name]===undefined) return '';
  return biasMap[name]>0.2?'bull':biasMap[name]<-0.2?'bear':'neutral';
}

// Tabs
document.querySelectorAll('.sidebar-tab').forEach(t=>{
  t.onclick=()=>{
    document.querySelectorAll('.sidebar-tab').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    document.getElementById('tab-'+t.dataset.tab).classList.add('active');
  };
});

// Filters
document.getElementById('filters').onclick=e=>{
  const b=e.target.closest('.filter-btn');
  if(!b)return;
  filter=b.dataset.f;
  document.querySelectorAll('.filter-btn').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  renderFeed();
};

// Badge helper
// Store full search results by ID for expand/collapse
const _searchResults={};

function toggleSearch(id){
  const el=document.getElementById(id);
  const btn=document.getElementById('btn-'+id);
  const full=_searchResults[id]||'';
  if(!el||!btn) return;
  if(el.classList.contains('collapsed')){
    el.classList.remove('collapsed');
    el.textContent=full;
    btn.textContent='Show less ▴';
  }else{
    el.classList.add('collapsed');
    el.textContent=full.slice(0,300)+(full.length>300?'...':'');
    btn.textContent='Show more ▾';
  }
}
window.toggleSearch=toggleSearch;

function badge(type){
  const t=(type||'').toUpperCase();
  const map={
    'CREATE_POST':['Post','badge-post'],
    'LIKE_POST':['Like','badge-like'],
    'REPOST':['Repost','badge-repost'],
    'QUOTE_POST':['Quote','badge-quote'],
    'CREATE_COMMENT':['Comment','badge-comment'],
    'FOLLOW':['Follow','badge-follow'],
    'SEARCH_POSTS':['Search','badge-other'],
    'DO_NOTHING':['Idle','badge-idle'],
    'UPVOTE_POST':['Upvote','badge-like'],
    'DOWNVOTE_POST':['Downvote','badge-like'],
    'DISLIKE_POST':['Dislike','badge-like'],
    'SEARCH_WEB':['🔍 Search','badge-search'],
  };
  const [label,cls]=map[t]||[t.replace(/_/g,' '),'badge-other'];
  return `<span class="post-badge ${cls}">${label}</span>`;
}

// Filter actions — skip sign_up, event markers
function realActions(){
  return actions.filter(a=>{
    if(a.event) return false;
    const t=(a.action_type||'').toLowerCase();
    if(t==='sign_up'||t==='signup'||t==='refresh') return false;
    return true;
  });
}

function filtered(){
  let list=realActions();
  if(filter==='posts') list=list.filter(a=>['CREATE_POST','create_post','QUOTE_POST','quote_post'].includes(a.action_type));
  else if(filter==='searches') list=list.filter(a=>['SEARCH_WEB','search_web'].includes(a.action_type));
  else if(filter==='fact-checks') list=list.filter(a=>a.fact_check);
  else if(filter==='twitter') list=list.filter(a=>a.platform==='twitter');
  else if(filter==='reddit') list=list.filter(a=>a.platform==='reddit');
  return list;
}

// ── Render Feed ──
function renderFeed(){
  const el=document.getElementById('feed');
  const empty=document.getElementById('feed-empty');
  const list=filtered();

  if(!list.length){
    el.innerHTML='';
    el.appendChild(empty);
    empty.style.display='';
    document.getElementById('feed-count').textContent='0 events';
    return;
  }
  if(empty)empty.style.display='none';
  document.getElementById('feed-count').textContent=list.length+' events';
  // Update search count
  const searchCount=realActions().filter(a=>['SEARCH_WEB','search_web'].includes(a.action_type)).length;
  const searchEl=document.getElementById('search-count');
  if(searchEl) searchEl.textContent=searchCount;
  if(searchEl) searchEl.parentElement.style.display=searchCount>0?'':'none';

  const rev=[...list].reverse();
  el.innerHTML=rev.slice(0,500).map(a=>{
    const name=a.agent_name||('agent_'+a.agent_id);
    const initial=name.charAt(0);
    const cls=getBiasClass(name);
    const args=a.action_args||{};
    const content=args.content||args.text||'';
    const type=(a.action_type||'').toUpperCase();

    let body='';
    let actionInfo='';

    if(type==='LIKE_POST'||type==='UPVOTE_POST'||type==='DOWNVOTE_POST'||type==='DISLIKE_POST'){
      const icon=type.includes('LIKE')||type.includes('UPVOTE')?'&#9829;':'&#9663;';
      actionInfo=`<div class="post-action-info">${icon} ${esc(args.target_agent||args.post_author||'')}</div>`;
      if(args.original_content||args.post_content)
        body=`<div class="post-quoted">${esc((args.original_content||args.post_content||'').slice(0,200))}</div>`;
    }else if(type==='REPOST'){
      actionInfo=`<div class="post-action-info">&#8635; ${esc(args.original_author||args.post_author||'')}</div>`;
      if(args.original_content||args.post_content)
        body=`<div class="post-quoted">${esc((args.original_content||args.post_content||'').slice(0,200))}</div>`;
    }else if(type==='FOLLOW'){
      actionInfo=`<div class="post-action-info">Followed ${esc(args.target||args.followee_name||'')}</div>`;
    }else if(type==='SEARCH_WEB'){
      const query=args.query||'';
      const result=args.result||content||'';
      const cleanResult=result.replace(/^\[WEB SEARCH RESULT\].*?\n\n/,'');
      const mainParts=cleanResult.split(/\nSources:\n/);
      const mainResult=mainParts[0]||'';
      const sources=mainParts[1]||'';
      const searchId='search-'+a.round+'-'+a.agent_id+'-'+Math.random().toString(36).slice(2,6);
      _searchResults[searchId]=mainResult;
      const preview=mainResult.slice(0,300)+(mainResult.length>300?'...':'');
      body=`<div class="search-card">
        <div class="search-query">🔍 ${esc(query)}</div>
        <div class="search-result collapsed" id="${searchId}">${esc(mainResult)}</div>
        ${mainResult.length>300?`<div class="search-toggle" id="btn-${searchId}" onclick="toggleSearch('${searchId}')">Show more ▾</div>`:''}
        ${sources?`<div class="search-sources">📎 ${esc(sources.slice(0,300))}</div>`:''}
      </div>`;
    }else if(type==='QUOTE_POST'){
      body=`<div class="post-body">${esc(content.slice(0,500))}</div>`;
      if(args.original_content||args.post_content)
        body+=`<div class="post-quoted">${esc((args.original_content||args.post_content||'').slice(0,200))}</div>`;
    }else if(content){
      body=`<div class="post-body">${esc(content.slice(0,500))}</div>`;
    }

    // Fact-check verdict badge
    let verdictHtml='';
    if(a.fact_check){
      const fc=a.fact_check;
      const vmap={'verified':['&#10003; Verified','verdict-verified'],'mismatch':['&#10007; Mismatch','verdict-mismatch'],'partial':['~ Partial','verdict-partial']};
      const [vlabel,vcls]=vmap[fc.overall_verdict]||['? Unknown','verdict-unverifiable'];
      verdictHtml=`<span class="verdict-badge ${vcls}" title="${fc.claims.length} claim(s) checked">${vlabel}</span>`;
    }

    // Fact-check detail block
    let fcHtml='';
    if(a.fact_check&&a.fact_check.claims.length){
      const fc=a.fact_check;
      const claimsHtml=fc.claims.map(c=>{
        const color=c.verdict==='verified'?'var(--green)':c.verdict==='mismatch'?'var(--red)':'var(--text-3)';
        const icon=c.verdict==='verified'?'&#10003;':c.verdict==='mismatch'?'&#10007;':'?';
        return `<div class="fc-claim"><span style="color:${color};font-weight:700;flex-shrink:0">${icon}</span><div><div style="color:var(--text-2)">&ldquo;${esc(c.claim)}&rdquo;</div>${c.reality?`<div style="color:var(--text-3);font-style:italic;margin-top:2px">&rarr; ${esc(c.reality)}</div>`:''}</div></div>`;
      }).join('');
      const sources=fc.claims.flatMap(c=>c.sources||[]).filter(Boolean);
      fcHtml=`<div class="fc-detail ${fc.overall_verdict}">${claimsHtml}${sources.length?`<div class="fc-sources">Sources: ${esc(sources.slice(0,3).join(', '))}</div>`:''}</div>`;
    }

    return `<div class="post">
      <div class="post-head">
        <div class="avatar ${cls}">${esc(initial)}</div>
        <div class="post-meta">
          <div class="post-name">${esc(name)}</div>
          <div class="post-sub">${badge(a.action_type)}${verdictHtml} <span>${esc(a.platform||'')}</span> <span>R${a.round||0}</span></div>
        </div>
      </div>
      ${actionInfo}${body}${fcHtml}
    </div>`;
  }).join('');
}

// ── Render Agents ──
function renderAgents(){
  const el=document.getElementById('tab-agents');
  if(!profiles.length){el.innerHTML='<div class="empty-state">No profiles</div>';return;}

  // Build per-agent action lists
  const agentActions={};
  realActions().forEach(a=>{
    const n=a.agent_name||'agent_'+a.agent_id;
    if(!agentActions[n]) agentActions[n]=[];
    agentActions[n].push(a);
  });
  // Count searches per agent
  const agentSearches={};
  realActions().filter(a=>['SEARCH_WEB','search_web'].includes(a.action_type)).forEach(a=>{
    const n=a.agent_name||'agent_'+a.agent_id;
    agentSearches[n]=(agentSearches[n]||0)+1;
  });
  // Per-agent fact-check accuracy
  const agentFC={};
  realActions().filter(a=>a.fact_check).forEach(a=>{
    const n=a.agent_name||'agent_'+a.agent_id;
    if(!agentFC[n]) agentFC[n]={total:0,verified:0};
    agentFC[n].total++;
    if(a.fact_check.overall_verdict==='verified') agentFC[n].verified++;
  });

  el.innerHTML=profiles.map(p=>{
    const bias=p.sentiment_bias||0;
    const cls=bias>0.2?'bull':bias<-0.2?'bear':'neutral';
    const bw=Math.abs(bias)*50;
    const bclass=bias>=0?'bull':'bear';
    const bstyle=bias>=0?`left:50%;width:${bw}%`:`right:50%;width:${bw}%`;
    const myActions=agentActions[p.name]||[];
    biasMap[p.name]=bias;

    // Topics
    const topics=(p.interested_topics||[]).map(t=>`<span class="tag topic">${esc(t)}</span>`).join('');

    // Per-agent action log
    let actionLog='';
    if(myActions.length){
      actionLog=myActions.map(a=>{
        const t=(a.action_type||'').toUpperCase();
        const content=(a.action_args||{}).content||(a.action_args||{}).text||'';
        const summary=content?esc(content.slice(0,150)):esc(t.replace(/_/g,' ').toLowerCase());
        return `<div class="agent-action">
          <div class="agent-action-round">R${a.round||0}</div>
          <div class="agent-action-content">${badge(a.action_type)} ${summary}</div>
        </div>`;
      }).join('');
    }else{
      actionLog='<div style="font-size:11px;color:var(--text-3);padding:4px 0">No actions yet</div>';
    }

    return `<div class="agent" onclick="this.classList.toggle('expanded')">
      <div class="agent-top">
        <div class="agent-av ${cls}">${esc((p.name||'?')[0])}</div>
        <div class="agent-info">
          <div class="agent-name">${esc(p.name)}</div>
          <div class="agent-handle">@${esc(p.username)} · ${esc(p.profession)}</div>
        </div>
      </div>
      <div class="agent-tags">
        <span class="tag">${esc(p.archetype)}</span>
        <span class="tag">${esc(p.mbti||'')}</span>
        <span class="tag">age ${p.age||'?'}</span>
        <span class="tag">influence ${p.influence_weight||0}</span>
      </div>
      <div class="agent-summary">
        <div><span class="agent-stat-label">Acts</span> <span class="agent-stat-val">${myActions.length}</span></div>
        ${(agentSearches[p.name]||0)>0?`<div><span class="agent-stat-label">🔍</span> <span class="agent-stat-val search-stat">${agentSearches[p.name]}</span></div>`:''}
        ${(agentFC[p.name]&&agentFC[p.name].total>0)?`<div><span class="agent-stat-label">Accuracy</span> <span class="agent-stat-val">${Math.round((agentFC[p.name].verified/agentFC[p.name].total)*100)}%</span></div>`:''}
        <div><span class="agent-stat-label">Bias</span> <span class="agent-stat-val">${bias>0?'+':''}${bias.toFixed(1)}</span></div>
        <div class="bias-bar"><div class="bias-fill ${bclass}" style="${bstyle}"></div></div>
        <div class="expand-hint">click to expand</div>
      </div>

      <div class="agent-detail">
        <div class="agent-section-label">Bio</div>
        <div class="agent-bio-full">${esc(p.bio||'')}</div>

        <div class="agent-section-label">Topics</div>
        <div class="agent-tags">${topics||'<span style="font-size:11px;color:var(--text-3)">none</span>'}</div>

        <div class="agent-section-label">Full Persona</div>
        <div class="agent-persona">${esc(p.persona||'No persona data')}</div>

        <div class="agent-section-label">Actions (${myActions.length})</div>
        <div class="agent-action-log">${actionLog}</div>
      </div>
    </div>`;
  }).join('');
}

// ── Render Fact Checks ──
function renderFactChecks(){
  const el=document.getElementById('tab-fact-checks');
  const checked=realActions().filter(a=>a.fact_check);
  if(!checked.length){el.innerHTML='<div class="empty-state">No fact-checks yet</div>';return;}

  const total=checked.length;
  const verified=checked.filter(a=>a.fact_check.overall_verdict==='verified').length;
  const mismatched=checked.filter(a=>a.fact_check.overall_verdict==='mismatch').length;
  const partial=total-verified-mismatched;

  let html=`<div style="padding:14px 0;border-bottom:1px solid var(--border-light)">
    <div style="font-size:11px;font-weight:600;margin-bottom:8px">ACCURACY SUMMARY</div>
    <div style="display:flex;gap:12px;font-family:var(--mono);font-size:12px">
      <span style="color:var(--green)">&#10003; ${verified}</span>
      <span style="color:var(--red)">&#10007; ${mismatched}</span>
      <span style="color:var(--amber)">~ ${partial}</span>
      <span style="color:var(--text-3)">${total} checked</span>
    </div>
  </div>`;

  // Per-agent accuracy
  const agentAcc={};
  checked.forEach(a=>{
    const name=a.agent_name||'unknown';
    if(!agentAcc[name]) agentAcc[name]={total:0,verified:0,mismatch:0};
    agentAcc[name].total++;
    if(a.fact_check.overall_verdict==='verified') agentAcc[name].verified++;
    if(a.fact_check.overall_verdict==='mismatch') agentAcc[name].mismatch++;
  });

  html+='<div style="padding:14px 0;border-bottom:1px solid var(--border-light)">';
  html+='<div style="font-size:11px;font-weight:600;margin-bottom:8px">PER-AGENT ACCURACY</div>';
  Object.entries(agentAcc).sort((a,b)=>b[1].mismatch-a[1].mismatch).forEach(([name,stats])=>{
    const pct=stats.total?Math.round((stats.verified/stats.total)*100):0;
    const color=pct>=80?'var(--green)':pct>=50?'var(--amber)':'var(--red)';
    html+=`<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:11px">
      <span>${esc(name)}</span>
      <span style="font-family:var(--mono);color:${color}">${pct}% (${stats.verified}/${stats.total})</span>
    </div>`;
  });
  html+='</div>';

  // All claims list, mismatches first
  html+='<div style="padding:14px 0"><div style="font-size:11px;font-weight:600;margin-bottom:8px">ALL CLAIMS</div>';
  const sorted=[...checked].sort((a,b)=>{
    const order={mismatch:0,partial:1,verified:2};
    return (order[a.fact_check.overall_verdict]||3)-(order[b.fact_check.overall_verdict]||3);
  });
  sorted.forEach(a=>{
    const fc=a.fact_check;
    const name=a.agent_name||'unknown';
    fc.claims.forEach(c=>{
      const icon=c.verdict==='verified'?'&#10003;':c.verdict==='mismatch'?'&#10007;':'?';
      const color=c.verdict==='verified'?'var(--green)':c.verdict==='mismatch'?'var(--red)':'var(--text-3)';
      html+=`<div style="padding:8px 0;border-bottom:1px solid var(--border-light);font-size:11px">
        <div style="display:flex;gap:6px;align-items:baseline">
          <span style="color:${color};font-weight:700">${icon}</span>
          <span style="font-weight:600">${esc(name)}</span>
          <span style="color:var(--text-3);font-family:var(--mono)">R${a.round||0}</span>
        </div>
        <div style="margin-top:4px;color:var(--text-2)">&ldquo;${esc(c.claim)}&rdquo;</div>
        ${c.reality?`<div style="margin-top:2px;color:var(--text-3);font-style:italic">&rarr; ${esc(c.reality)}</div>`:''}
      </div>`;
    });
  });
  html+='</div>';

  el.innerHTML=html;
}

function renderReport(text){
  const el=document.getElementById('tab-report');
  if(!text||text==='Report not generated yet.'){
    el.innerHTML='<div class="empty-state">Not generated yet</div>';
    return;
  }
  let html=esc(text)
    .replace(/^### (.+)$/gm,'<h3>$1</h3>')

// ── Stats ──
function renderStats(status){
  const real=realActions();
  const tw=real.filter(a=>a.platform==='twitter');
  const rd=real.filter(a=>a.platform==='reddit');

  document.getElementById('tw-stat').textContent=tw.length;
  document.getElementById('rd-stat').textContent=rd.length;
  document.getElementById('round-stat').textContent=(status.current_round||0)+'/'+(status.total_rounds||'?');
  document.getElementById('agent-stat').textContent=status.agents_active||profiles.length;

  const dot=document.getElementById('status-dot');
  const label=document.getElementById('status-label');
  const stage=status.stage||'waiting';

  if(stage==='done'){
    dot.classList.add('done');
    label.textContent='complete';
  }else if(stage==='simulating'){
    dot.classList.remove('done');
    label.textContent='simulating R'+(status.current_round||0);
  }else if(stage==='generating_report'){
    dot.classList.remove('done');
    label.textContent='generating report';
  }else{
    dot.classList.remove('done');
    label.textContent=stage;
  }

  // Pipeline bar
  const stages=['waiting','configuring','ready','simulating','generating_report','done'];
  const stageIdx=stages.indexOf(stage);
  const stepMap={
    'ps-profiles':['waiting','configuring'],
    'ps-config':['configuring','ready'],
    'ps-sim':['simulating'],
    'ps-report':['generating_report'],
    'ps-done':['done']
  };
  // Mark steps as done or active
  const stepOrder=['ps-profiles','ps-config','ps-sim','ps-report','ps-done'];
  const stepStageIdx={'ps-profiles':1,'ps-config':2,'ps-sim':3,'ps-report':4,'ps-done':5};
  stepOrder.forEach(id=>{
    const el=document.getElementById(id);
    el.classList.remove('active','done-step');
    const myIdx=stepStageIdx[id];
    if(stageIdx>=myIdx){
      el.classList.add('done-step');
      el.querySelector('.pipe-icon').innerHTML='&#10003;';
    }else if(stepMap[id].includes(stage)){
      el.classList.add('active');
      el.querySelector('.pipe-icon').innerHTML='&#9654;';
    }else{
      el.querySelector('.pipe-icon').innerHTML='&#9679;';
    }
  });

  // Round counter on sim step
  const simRound=document.getElementById('ps-sim-round');
  if(stage==='simulating'){
    simRound.textContent='R'+(status.current_round||0)+'/'+(status.total_rounds||'?');
  }else if(stageIdx>3){
    simRound.textContent=(status.total_rounds||'?')+' rounds';
  }else{
    simRound.textContent='';
  }

  // Action breakdown in pipe-detail
  const bd=status.action_breakdown||{};
  const detailEl=document.getElementById('pipe-detail');
  const parts=[];
  if(bd.create_post) parts.push(`<span class="pd-item">Posts <span class="pd-val">${bd.create_post}</span></span>`);
  if(bd.like_post) parts.push(`<span class="pd-item">Likes <span class="pd-val">${bd.like_post}</span></span>`);
  if(bd.repost) parts.push(`<span class="pd-item">Reposts <span class="pd-val">${bd.repost}</span></span>`);
  if(bd.create_comment) parts.push(`<span class="pd-item">Comments <span class="pd-val">${bd.create_comment}</span></span>`);
  if(bd.follow) parts.push(`<span class="pd-item">Follows <span class="pd-val">${bd.follow}</span></span>`);
  if(bd.do_nothing) parts.push(`<span class="pd-item">Idle <span class="pd-val">${bd.do_nothing}</span></span>`);
  // Count web searches from actions
  const searchTotal=realActions().filter(a=>['SEARCH_WEB','search_web'].includes(a.action_type)).length;
  if(searchTotal) parts.push(`<span class="pd-item">🔍 <span class="pd-val search-stat">${searchTotal}</span></span>`);
  const fcTotal=realActions().filter(a=>a.fact_check).length;
  const fcVerified=realActions().filter(a=>a.fact_check&&a.fact_check.overall_verdict==='verified').length;
  if(fcTotal) parts.push(`<span class="pd-item">&#10003;&#10007; <span class="pd-val">${fcVerified}/${fcTotal}</span></span>`);
  detailEl.innerHTML=parts.join('');
}

// ── Fetch Loop ──
async function fetchAll(){
  try{
    const base=activeSim?API+'/api/simulations/'+activeSim:API+'/api';
    const [aR,pR,cR,sR,rR,seedR]=await Promise.all([
      fetch(base+'/actions'),fetch(base+'/profiles'),
      fetch(base+'/config'),fetch(base+'/status'),
      fetch(base+'/report'),fetch(base+'/seeds'),
    ]);
    actions=await aR.json();
    const p=await pR.json();
    if(Array.isArray(p)){
      profiles=p;
      profiles.forEach(pr=>{biasMap[pr.name]=pr.sentiment_bias||0;});
    }
    config=await cR.json();
    const status=await sR.json();
    const report=await rR.text();
    const seeds=await seedR.json().catch(()=>[]);

    if(config.simulation_id) document.getElementById('sim-id').textContent=config.simulation_id;

    renderStats(status);
    renderFeed();
    renderAgents();
    renderSeeds(seeds);
    renderConfig();
    renderFactChecks();
    renderReport(report);
  }catch(e){console.warn('fetch:',e)}
}

fetchAll();
setInterval(fetchAll,3000);

// ── Resizer drag ──
(function(){
  const resizer=document.getElementById('resizer');
  const sidebar=document.querySelector('.sidebar');
  let dragging=false,startX,startW;
  resizer.addEventListener('mousedown',e=>{
    dragging=true;startX=e.clientX;startW=sidebar.offsetWidth;
    resizer.classList.add('dragging');
    document.body.style.cursor='col-resize';
    document.body.style.userSelect='none';
  });
  document.addEventListener('mousemove',e=>{
    if(!dragging)return;
    const dx=startX-e.clientX;
    sidebar.style.width=Math.max(200,startW+dx)+'px';
  });
  document.addEventListener('mouseup',()=>{
    if(!dragging)return;
    dragging=false;
    resizer.classList.remove('dragging');
    document.body.style.cursor='';
    document.body.style.userSelect='';
  });
})();
})();
</script>
</body>
</html>
